<path d="M24.0,154.0 H250.4 Q254.4,154.0 254.4,158.0 V172.0 Q254.4,176.0 250.4,176.0 H24.0 Z" fill="#2a78d6"><title>MIG-packed (first-fit decreasing): 8 GPUs for 20 replicas; planner estimates use 66.5% of their memory</title></path>
