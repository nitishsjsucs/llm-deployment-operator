<text x="168.0" y="206.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">5</text>
<line x1="312.0" y1="78" x2="312.0" y2="190" stroke="#e1e0d9" stroke-width="1"/>
<text x="312.0" y="206.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">10</text>
<line x1="456.0" y1="78" x2="456.0" y2="190" stroke="#e1e0d9" stroke-width="1"/>
<text x="456.0" y="206.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">15</text>
<line x1="600.0" y1="78" x2="600.0" y2="190" stroke="#e1e0d9" stroke-width="1"/>
<text x="600.0" y="206.0" fill="#898781" font-size="11" font-weight="400" text-anchor="middle">20</text>
<text x="600.0" y="222.0" fill="#898781" font-size="11" font-weight="400" text-anchor="end">GPUs</text>
<text x="24.0" y="93.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="start" stroke="#fcfcfb" stroke-width="5" stroke-linejoin="round" paint-order="stroke">One replica per whole GPU<tspan fill="#898781" font-weight="400">  ·  planner estimates fill 26.6% of their memory</tspan></text>
<path d="M24.0,100.0 H596.0 Q600.0,100.0 600.0,104.0 V118.0 Q600.0,122.0 596.0,122.0 H24.0 Z" fill="#b9b7ae"><title>One replica per whole GPU: 20 GPUs for 20 replicas; planner estimates use 26.6% of their memory</title></path>
