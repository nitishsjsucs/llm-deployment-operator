---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tenantquotas.serving.llmops.dev
spec:
  group: serving.llmops.dev
  names:
    kind: TenantQuota
    listKind: TenantQuotaList
    plural: tenantquotas
    shortNames:
    - tq
    singular: tenantquota
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .status.usedGPUMemoryGiB
      name: Used GiB
      type: integer
    - jsonPath: .spec.maxGPUMemoryGiB
      name: Max GiB
      type: integer
    - jsonPath: .status.deployments
      name: Deployments
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenantQuota limits the MIG slices a tenant's ModelDeployments
          may claim.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TenantQuotaSpec defines the limits for one tenant.
            properties:
              maxGPUMemoryGiB:
                description: |-
                  MaxGPUMemoryGiB caps the nominal memory of all MIG instances the tenant
                  holds (20 GiB per 1g.20gb instance, 80 GiB per 7g.80gb instance).
                format: int64
                minimum: 0
                type: integer
              migSlices:
                description: |-
                  MIGSlices caps MIG instances per profile across all of the tenant's
                  deployments, including canaries. Profiles that are not listed are only
                  bound by maxGPUMemoryGiB.
                items:
                  description: SliceLimit caps the number of MIG instances of one
                    profile.
                  properties:
                    max:
                      description: Max is the maximum number of instances.
                      format: int32
                      minimum: 0
                      type: integer
                    profile:
                      description: Profile is the MIG profile, e.g. 1g.20gb.
                      pattern: ^[1-7]g\.[0-9]+gb$
                      type: string
                  required:
                  - max
                  - profile
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - profile
                x-kubernetes-list-type: map
              tenant:
                description: Tenant is matched against ModelDeployment spec.tenant.
                maxLength: 63
                minLength: 1
                type: string
            required:
            - tenant
            type: object
          status:
            description: TenantQuotaStatus reports the tenant's current usage.
            properties:
              deployments:
                description: Deployments is the number of ModelDeployments of the
                  tenant.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              usedGPUMemoryGiB:
                description: UsedGPUMemoryGiB is the nominal memory of those instances.
                format: int64
                type: integer
              usedSlices:
                description: UsedSlices are the MIG instances held by the tenant's
                  deployments.
                items:
                  description: SliceCount is the number of MIG instances of one profile
                    in use.
                  properties:
                    count:
                      format: int32
                      type: integer
                    profile:
                      type: string
                  required:
                  - count
                  - profile
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - profile
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
