---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: modeldeployments.serving.llmops.dev
spec:
  group: serving.llmops.dev
  names:
    kind: ModelDeployment
    listKind: ModelDeploymentList
    plural: modeldeployments
    shortNames:
    - mdep
    singular: modeldeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenant
      name: Tenant
      type: string
    - jsonPath: .status.selectedVariant.quantization
      name: Variant
      type: string
    - jsonPath: .status.migProfile
      name: MIG
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.canaryWeight
      name: Canary
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelDeployment rolls out an LLM on KServe, choosing a quantized variant and
          a MIG profile that fit the GPU budget.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelDeploymentSpec defines the desired state of ModelDeployment.
            properties:
              gpuBudget:
                description: GPUBudget bounds the resources of one replica.
                properties:
                  gpuType:
                    description: GPUType is the MIG-capable GPU model the replicas
                      run on.
                    enum:
                    - A100-80GB
                    - A100-40GB
                    - H100-80GB
                    type: string
                  maxConcurrentSequences:
                    default: 8
                    description: |-
                      MaxConcurrentSequences is the number of sequences a replica serves at
                      once (vLLM --max-num-seqs). The KV cache is sized so that all of them can
                      reach maxModelLen.
                    format: int32
                    minimum: 1
                    type: integer
                  maxMemoryGiBPerReplica:
                    description: |-
                      MaxMemoryGiBPerReplica caps the usable memory of the MIG profile a
                      replica may claim. Without it any profile of the GPU may be chosen.
                    format: int32
                    minimum: 1
                    type: integer
                  maxModelLen:
                    default: 8192
                    description: MaxModelLen is the context length per sequence (vLLM
                      --max-model-len).
                    format: int32
                    minimum: 256
                    type: integer
                required:
                - gpuType
                type: object
              model:
                description: Model identifies the model and its architecture.
                properties:
                  architecture:
                    description: Architecture describes a model that is not in the
                      built-in catalog.
                    properties:
                      headDim:
                        description: |-
                          HeadDim is the attention head dimension (hidden_size / num_attention_heads
                          unless head_dim is set explicitly).
                        format: int32
                        minimum: 1
                        type: integer
                      hiddenSize:
                        description: |-
                          HiddenSize is hidden_size. Together with VocabSize it sizes the embedding
                          and LM head, which AWQ and GPTQ checkpoints keep in 16-bit precision.
                        format: int32
                        minimum: 1
                        type: integer
                      kvHeads:
                        description: KVHeads is num_key_value_heads.
                        format: int32
                        minimum: 1
                        type: integer
                      layers:
                        description: Layers is num_hidden_layers.
                        format: int32
                        minimum: 1
                        type: integer
                      maxContextLength:
                        description: |-
                          MaxContextLength is max_position_embeddings. gpuBudget.maxModelLen may
                          not exceed it.
                        format: int32
                        minimum: 1
                        type: integer
                      parametersMillions:
                        description: |-
                          ParametersMillions is the total parameter count in millions, e.g. 8030
                          for an 8.03B model.
                        format: int64
                        minimum: 1
                        type: integer
                      tiedEmbeddings:
                        description: TiedEmbeddings is tie_word_embeddings.
                        type: boolean
                      vocabSize:
                        description: VocabSize is vocab_size.
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - headDim
                    - hiddenSize
                    - kvHeads
                    - layers
                    - parametersMillions
                    - vocabSize
                    type: object
                  catalogRef:
                    description: CatalogRef selects a built-in architecture entry.
                    enum:
                    - llama-3.1-8b
                    - llama-3.1-70b
                    - qwen2.5-7b
                    - qwen2.5-14b
                    - qwen2.5-72b
                    type: string
                  family:
                    description: Family is the model family.
                    enum:
                    - llama
                    - qwen
                    type: string
                  name:
                    description: |-
                      Name is the model name clients use in OpenAI-compatible requests, for
                      example meta-llama/Llama-3.1-8B-Instruct. It is passed to vLLM as
                      --served-model-name and to KServe as spec.model.name.
                    minLength: 1
                    type: string
                required:
                - family
                - name
                type: object
                x-kubernetes-validations:
                - message: exactly one of catalogRef or architecture must be set
                  rule: has(self.catalogRef) != has(self.architecture)
              replicas:
                default: 1
                description: Replicas is the number of vLLM replicas, each claiming
                  one MIG instance.
                format: int32
                minimum: 0
                type: integer
              rollout:
                default: {}
                description: Rollout configures how changes are rolled out.
                properties:
                  progressDeadline:
                    default: 30m
                    description: |-
                      ProgressDeadline is how long a step may wait for the canary to be Ready
                      before the rollout is rolled back.
                    type: string
                  stepInterval:
                    default: 5m
                    description: |-
                      StepInterval is how long the canary must stay Ready at a step before it
                      moves to the next one (or, at the last step, is promoted).
                    type: string
                  steps:
                    default:
                    - 10
                    - 50
                    - 100
                    description: |-
                      Steps are the canary traffic weights in percent, applied in order. They
                      must increase strictly and end at 100.
                    items:
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    maxItems: 10
                    minItems: 1
                    type: array
                    x-kubernetes-validations:
                    - message: the last step must be 100
                      rule: self[size(self) - 1] == 100
                    - message: steps must be strictly increasing
                      rule: self.all(i, self.filter(j, j == i).size() == 1) && self.isSorted()
                  strategy:
                    default: Canary
                    description: Strategy is Canary or Recreate.
                    enum:
                    - Canary
                    - Recreate
                    type: string
                type: object
              routing:
                default: {}
                description: Routing configures the HTTPRoute in front of the revisions.
                properties:
                  gateway:
                    default: {}
                    description: Gateway the HTTPRoute attaches to.
                    properties:
                      name:
                        default: kserve-ingress-gateway
                        description: Name of the Gateway.
                        type: string
                      namespace:
                        default: kserve
                        description: Namespace of the Gateway.
                        type: string
                    type: object
                  hostnames:
                    description: Hostnames of the HTTPRoute. Empty matches all hostnames
                      of the Gateway.
                    items:
                      type: string
                    maxItems: 16
                    type: array
                type: object
              runtime:
                description: Runtime configures the vLLM container.
                properties:
                  env:
                    description: Env is added to the vLLM container, e.g. HF_TOKEN
                      from a Secret.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  extraArgs:
                    description: ExtraArgs are appended to the vLLM arguments the
                      operator generates.
                    items:
                      type: string
                    type: array
                  image:
                    description: |-
                      Image is the vLLM image. When empty, the image from KServe's
                      LLMInferenceServiceConfig is used.
                    type: string
                type: object
              tenant:
                description: |-
                  Tenant owns the deployment; its TenantQuota bounds the MIG slices the
                  deployment may claim.
                maxLength: 63
                minLength: 1
                type: string
              variants:
                description: |-
                  Variants are the available checkpoints. The planner picks the
                  highest-quality one that fits the GPU budget.
                items:
                  description: ModelVariant is one checkpoint of the model.
                  properties:
                    bits:
                      description: Bits is the weight width. It defaults to 16 for
                        fp16 and 4 for awq and gptq.
                      format: int32
                      type: integer
                    quantization:
                      description: Quantization is the weight format.
                      enum:
                      - fp16
                      - awq
                      - gptq
                      type: string
                    uri:
                      description: |-
                        URI is the checkpoint location in a form KServe's storage initializer
                        understands, e.g. hf://hugging-quants/Meta-Llama-3.1-8B-Instruct-AWQ-INT4.
                      pattern: ^(hf|s3|gs|pvc|oci|https?)://.+
                      type: string
                  required:
                  - quantization
                  - uri
                  type: object
                  x-kubernetes-validations:
                  - message: fp16 variants have 16 bits
                    rule: self.quantization != 'fp16' || !has(self.bits) || self.bits
                      == 16
                  - message: awq variants have 4 bits
                    rule: self.quantization != 'awq' || !has(self.bits) || self.bits
                      == 4
                  - message: gptq variants have 4 or 8 bits
                    rule: self.quantization != 'gptq' || !has(self.bits) || self.bits
                      == 4 || self.bits == 8
                maxItems: 8
                minItems: 1
                type: array
            required:
            - gpuBudget
            - model
            - tenant
            - variants
            type: object
          status:
            description: ModelDeploymentStatus defines the observed state of ModelDeployment.
            properties:
              allocatedSlices:
                description: |-
                  AllocatedSlices are the MIG instances claimed per revision. They count
                  against the tenant's quota.
                items:
                  description: SliceAllocation is the MIG capacity one revision holds.
                  properties:
                    count:
                      description: Count is the number of MIG instances (one per replica).
                      format: int32
                      type: integer
                    profile:
                      description: Profile is the MIG profile, e.g. 1g.20gb.
                      type: string
                    revision:
                      description: Revision is the revision hash.
                      type: string
                  required:
                  - count
                  - profile
                  - revision
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - revision
                x-kubernetes-list-type: map
              canaryRevision:
                description: CanaryRevision is the revision being rolled out.
                type: string
              canaryStep:
                description: |-
                  CanaryStep is the index into spec.rollout.steps, or -1 while the canary
                  starts up and receives no traffic.
                format: int32
                type: integer
              canaryStepStartTime:
                description: CanaryStepStartTime is when the current canary step began.
                format: date-time
                type: string
              canaryWeight:
                description: CanaryWeight is the percentage of traffic routed to the
                  canary.
                format: int32
                type: integer
              conditions:
                description: Conditions are Planned, Ready, Progressing, QuotaExceeded
                  and RolledBack.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              memoryEstimate:
                description: MemoryEstimate is the per-replica estimate for the current
                  spec.
                properties:
                  kvCacheMiB:
                    format: int64
                    type: integer
                  overheadMiB:
                    format: int64
                    type: integer
                  profileMiB:
                    description: ProfileMiB is the usable memory of the chosen MIG
                      profile.
                    format: int64
                    type: integer
                  totalMiB:
                    format: int64
                    type: integer
                  weightsMiB:
                    format: int64
                    type: integer
                required:
                - kvCacheMiB
                - overheadMiB
                - profileMiB
                - totalMiB
                - weightsMiB
                type: object
              migProfile:
                description: MIGProfile is the MIG profile planned for the current
                  spec.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status reflects.
                format: int64
                type: integer
              phase:
                description: Phase summarizes the state.
                enum:
                - Pending
                - Progressing
                - Ready
                - Failed
                type: string
              replicasPerGPU:
                description: ReplicasPerGPU is how many replicas of the current plan
                  fit on one GPU.
                format: int32
                type: integer
              rolledBackRevision:
                description: |-
                  RolledBackRevision is the last revision that was rolled back. It is not
                  retried until the spec changes to a different revision.
                type: string
              selectedVariant:
                description: |-
                  SelectedVariant is the variant planned for the current spec. During a
                  canary rollout this is the canary's variant.
                properties:
                  bits:
                    format: int32
                    type: integer
                  quantization:
                    description: Quantization is the weight format of a model variant.
                    enum:
                    - fp16
                    - awq
                    - gptq
                    type: string
                  uri:
                    type: string
                required:
                - bits
                - quantization
                - uri
                type: object
              stableRevision:
                description: StableRevision is the revision serving production traffic.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
