<svg xmlns="http://www.w3.org/2000/svg" width="720" height="234" viewBox="0 0 720 234" role="img" aria-label="20 GPUs with one replica per whole GPU versus 8 GPUs when the same 20 replicas are packed onto MIG instances" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
