{{- /* The rules are generated by controller-gen into config/rbac/role.yaml and copied by `make manifests`. */}}
{{- $role := .Files.Get "files/role.yaml" | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-deployment-operator.fullname" . }}
  labels:
    {{- include "llm-deployment-operator.labels" . | nindent 4 }}
rules:
  {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-deployment-operator.fullname" . }}
  labels:
    {{- include "llm-deployment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-deployment-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-deployment-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.leaderElection }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "llm-deployment-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-deployment-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "llm-deployment-operator.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-deployment-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "llm-deployment-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "llm-deployment-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
