<text x="24.0" y="54.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Static allocation from the planner's memory estimates (cmd/packsim), not measured GPU utilization</text>
<line x1="24.0" y1="78" x2="24.0" y2="190" stroke="#c3c2b7" stroke-width="1"/>
